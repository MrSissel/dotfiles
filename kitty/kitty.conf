# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

# Font
# BEGIN_KITTY_FONTS
font_size 14 
font_family      family="Maple Mono NF CN"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# window
hide_window_decorations       titlebar-only
window_padding_width 8 0 0 0
background_opacity            0.9
background_blur               30
remember_window_size          yes

# tab bar

tab_bar_edge                  bottom
tab_bar_style                 powerline
tab_powerline_style           round

# general key mapping
macos_option_as_alt yes

# vim key mapping
# map cmd+s send_text all \e:w\r

# tmux key mapping (Has been abandoned)
# tab change mapping
# map cmd+1 combine : send_key ctrl+s : send_key 1
# map cmd+2 combine : send_key ctrl+s : send_key 2
# map cmd+3 combine : send_key ctrl+s : send_key 3
# map cmd+4 combine : send_key ctrl+s : send_key 4
# map cmd+5 combine : send_key ctrl+s : send_key 5
# map cmd+6 combine : send_key ctrl+s : send_key 6
# map cmd+7 combine : send_key ctrl+s : send_key 7
# map cmd+8 combine : send_key ctrl+s : send_key 8
# map cmd+9 combine : send_key ctrl+s : send_key 9

# kitty tab  
## 1. change mapping
map cmd+1 goto_tab 1 
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
## 2. rename title
map shift+cmd+i set_tab_title
## 3. copy mode
map cmd+[ show_scrollback
scrollback_pager vim -u NONE -
  \ -c 'w! /tmp/kitty_scrollback' 
  \ -c 'term ++curwin cat /tmp/kitty_scrollback'
  \ -c "set clipboard=unnamed"
  \ -c "nnoremap Y y$"
  \ -c "nnoremap i ZQ"
#  \ -c "hi Normal ctermbg=235"
## 4. split windows
map cmd+option+enter launch --cwd=current --location=vsplit
map cmd+option+shift+enter launch --cwd=current --location=hsplit
## 5. move_tab
# map cmd+shift+left move_tab_backward
# map cmd+shift+right move_tab_forward
## 6. new_tab
map cmd+t launch --type=tab --cwd=current
# shift+arrow move window
map ctrl+shift+up move_window up
map ctrl+shift+left move_window left
map ctrl+shift+right move_window right
map ctrl+shift+down move_window down
# ctrl + shift + arrow move to another pane
map ctrl+shift+k neighboring_window up
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+j neighboring_window down
# toggle fullscreen
# map ctrl+alt+g layout_action fullscreen
# enable split layout 
enabled_layouts splits:split_axis=horizontal

# nvim
map ctrl+tab no_op
map ctrl+shift+tab no_op

# cursor
# cursor_blink_interval 0

# https://www.bilibili.com
detect_urls yes
mouse_hide_wait 0.5

# shell_integration no-cursor
map shift+enter send_text all \e\r
