# Plugins
## - List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
# set -g @plugin 'christoomey/vim-tmux-navigator'
## - catppuccin theme
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavour 'macchiato'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_tabs_enabled on
# 只显示编号和手动窗口名，隐藏 pane_title
# set -g @catppuccin_window_current_text "#{window_index}:#{window_name}"
# set -g @catppuccin_window_default_text "#{window_index}:#{window_name}"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

## - Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Options to make tmux more pleasant
# 允许终端转义序列通过，使得光标形状和闪烁能被底层终端正确识别
set -g allow-passthrough on
## - Solve the Vim color scheme problem
# set -g default-terminal 'xterm-256color'
# set -g default-terminal "screen-256color"
set -g default-terminal 'xterm-kitty'
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
## - mouse on
set -g mouse on
## - Visual move
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


## - Set the default path for new windows and panes to the current working directory 
# set-option default-path "$PWD"

## - Open a new window with the same directory as the current pane
bind-key c new-window -c "#{pane_current_path}"

## - Split window with the same directory as the current pane
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"

## shortcuts key setting
## - pane move
unbind-key -n C-h
unbind-key -n C-j
unbind-key -n C-k
unbind-key -n C-l
bind -n C-S-k select-pane -U
bind -n C-S-j select-pane -D
bind -n C-S-h select-pane -L
bind -n C-S-l select-pane -R
# set -g @vim_navigator_mapping_left "C-S-h"
# set -g @vim_navigator_mapping_right "C-S-l"
# set -g @vim_navigator_mapping_up "C-S-k"
# set -g @vim_navigator_mapping_down "C-S-j"

# resize-pane
unbind-key M-Up
unbind-key M-down
unbind-key M-Left
unbind-key M-Right
bind -n M-C-k resize-pane -U 5
bind -n M-C-j resize-pane -D 5
bind -n M-C-h resize-pane -L 5
bind -n M-C-l resize-pane -R 5
# bind-key -r -T prefix       M-Up                   resize-pane -U 5
# bind-key -r -T prefix       M-Down                 resize-pane -D 5
# bind-key -r -T prefix       M-Left                 resize-pane -L 5
# bind-key -r -T prefix       M-Right                resize-pane -R 5


## - change the prefix
unbind C-b
set -g prefix C-s

## - fullscreen
bind -n M-f resize-pane -Z

## - toggle layout
bind -n M-F next-layout

## Nvim
unbind-key -n C-Tab
unbind-key -n C-S-Tab   # 针对 Ctrl+Shift+Tab
unbind-key -n C-BTab    # 若 tmux 以 C-BTab 识别 Ctrl+Shift+Tab

## - escape-time
set -s escape-time 0



## rename options
# set-option -g automatic-rename off
# set-window-option -g automatic-rename off


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
